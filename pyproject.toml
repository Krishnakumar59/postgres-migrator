[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pg-migrator"
version = "1.0.0"
description = "Zero-downtime, disaster-proof PostgreSQL provider migration & benchmarking toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "educastX", email = "contact@educastx.com" }
]
keywords = [
    "postgresql",
    "postgres",
    "database-migration",
    "pg-dump",
    "pg-restore",
    "database-benchmark",
    "disaster-recovery",
    "rollback"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/Krishnakumar59/postgres-migrator"
Repository = "https://github.com/Krishnakumar59/postgres-migrator"
Issues = "https://github.com/Krishnakumar59/postgres-migrator/issues"

[project.scripts]
pg-migrator = "pg_migrator.cli:main"
pg-migrate = "pg_migrator.cli:main"

[tool.setuptools.packages.find]
include = ["pg_migrator*"]
